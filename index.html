<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>透明度アタック - アクションは怖くない</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --panel-bg: #ffffff;
      --text-main: #212529;
      --border-color: #dee2e6;
      --accent-red: #d90429;
      --accent-blue: #0077b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      position: relative;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-title { font-size: 1.0rem; font-weight: bold; color: #333; }
    .btn-sm {
      background: #e9ecef;
      border: 1px solid #ced4da;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .btn-sm:hover { background: #dee2e6; }

    /* スコア ＆ タイム */
    .status-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-display { font-size: 1.4rem; font-weight: bold; color: var(--accent-red); }
    .score-display { font-size: 1.2rem; font-weight: bold; color: var(--accent-blue); }

    /* 敵エリア */
    .issue-panel {
      background: #fff5f5;
      border: 1px solid #ffc9c9;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #c92a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* パーティエリア＆ダメージアクション */
    .party-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transition: background-color 0.1s ease;
    }
    .party-panel.damage-flash {
      background-color: #ffc9c9 !important;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .party-member {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.68rem;
    }
    .member-icon { font-size: 1.5rem; }

    /* パーティスキル表示枠 */
    .synergy-box {
      background: #e7f5ff;
      border: 1px solid #a5d8ff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      color: #1864ab;
      line-height: 1.3;
    }

    /* パズルキャンバス容器とオーバーレイ */
    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      background: #ffffff;
      border: 2px solid #ced4da;
      border-radius: 8px;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    /* コンボオーバーレイ（キャンバス上に自動消滅） */
    .combo-overlay {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(33, 37, 41, 0.88);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease-out;
      z-index: 10;
      width: 80%;
    }
    .combo-overlay.show { opacity: 1; }
    .combo-text-main { font-size: 1.0rem; font-weight: bold; color: #4cc9f0; }
    .combo-text-sub { font-size: 0.75rem; color: #e9ecef; margin-top: 2px; }

    /* モーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 100;
    }
    .modal-title { font-size: 1.2rem; font-weight: bold; text-align: center; margin-bottom: 6px; }
    
    .select-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 52vh;
      overflow-y: auto;
      margin-bottom: 8px;
      padding-right: 4px;
    }
    .select-card-row {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .select-card-info { flex: 1; margin-left: 8px; }
    .select-card-info .name { font-weight: bold; font-size: 0.82rem; }
    .select-card-info .stats { font-size: 0.7rem; color: #0077b6; }
    .select-card-info .desc { font-size: 0.68rem; color: #666; }

    .counter-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-counter {
      width: 26px; height: 26px;
      border: 1px solid #ced4da;
      background: #fff;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-main {
      background: #212529;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn-main:active { transform: scale(0.98); }

    .explanation-box {
      background: #f1f3f5;
      border-left: 4px solid var(--accent-blue);
      padding: 10px;
      font-size: 0.78rem;
      line-height: 1.4;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <span class="game-title">透明度アタック</span>
    <button class="btn-sm" onclick="openPartySelect()">メンバーを選択する</button>
  </div>

  <!-- スコア＆タイマー -->
  <div class="status-panel">
    <div>
      <div style="font-size:0.68rem; color:#666;">透明度スコア</div>
      <div class="score-display" id="score-text">0 PTS</div>
    </div>
    <div>
      <div style="font-size:0.68rem; color:#666; text-align:right;">残り時間</div>
      <div class="timer-display" id="timer-text">60s</div>
    </div>
  </div>

  <!-- パーティスキル表示 -->
  <div class="synergy-box" id="synergy-display">
    発動スキル: なし
  </div>

  <!-- 敵エリア -->
  <div class="issue-panel">
    <span>⚠️ 敵: <strong id="issue-name">強行採決委員会</strong></span>
    <span style="font-size:0.68rem; color:#666;">(15秒毎に非開示攻撃)</span>
  </div>

  <!-- パーティ表示 -->
  <div class="party-panel" id="party-container"></div>

  <!-- パズル盤面 ＆ オーバーレイ -->
  <div class="canvas-container">
    <canvas id="puzzleCanvas" width="360" height="300"></canvas>
    <div class="combo-overlay" id="combo-overlay">
      <div class="combo-text-main" id="combo-main">開示成功！</div>
      <div class="combo-text-sub" id="combo-sub">3 Combo!</div>
    </div>
  </div>

  <!-- 【モーダル1】パーティ編成画面（全詳細＆重複選択対応） -->
  <div id="party-select-modal" class="modal-overlay" style="display:none;">
    <div>
      <div class="modal-title">メンバー選択</div>
      <p style="font-size: 0.75rem; color:#666; text-align:center; margin-bottom: 8px;">
        計5名を選択（同一職種の複数重複選択が可能）
      </p>
      
      <div class="select-list" id="selection-pool"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:0.78rem;">選択中: <strong id="select-count">0</strong> / 5</span>
        <button class="btn-sm" onclick="randomizeParty()">ランダム編成</button>
      </div>
      <div class="party-panel" id="selected-preview" style="min-height:46px;"></div>
    </div>

    <button class="btn-main" onclick="applyAndResumeGame()">決定して盤面更新</button>
  </div>

  <!-- 【モーダル2】リザルト画面 -->
  <div id="result-modal" class="modal-overlay" style="display:none;">
    <div>
      <div class="modal-title">タイムアップ！</div>
      <div style="text-align:center; margin: 16px 0;">
        <div style="font-size: 0.85rem; color:#666;">最終獲得透明度スコア</div>
        <div style="font-size: 2.2rem; font-weight:bold; color:var(--accent-blue);" id="final-score">0 PTS</div>
      </div>

      <div class="explanation-box" id="result-eval-text">
        市民の継続的な関心と法的アクションにより、権力の不透明な隠蔽を押し返しました！
      </div>
    </div>

    <div>
      <button class="btn-main" style="margin-bottom: 6px;" onclick="openPartySelect()">メンバーを変えて挑戦</button>
      <button class="btn-main" style="background:#6c757d;" onclick="startTimerGame()">このまま再挑戦</button>
    </div>
  </div>
</div>

<script>
  // --- 定数 ＆ 設定 ---
  const COLS = 6;
  const ROWS = 5;
  const TILE_SIZE = 60;
  const GAME_TIME = 60;

  const DROPS = {
    RED:    { bg: "#ffadad", border: "#ff6b6b", symbol: "🔍", name: "検証" },
    BLUE:   { bg: "#a0c4ff", border: "#4cc9f0", symbol: "📜", name: "署名" },
    GREEN:  { bg: "#caffbf", border: "#52b788", symbol: "🪧", name: "デモ" },
    YELLOW: { bg: "#fdffb6", border: "#ffd166", symbol: "📢", name: "拡散" },
    PINK:   { bg: "#ffc6ff", border: "#f72585", symbol: "💬", name: "対話" }
  };
  const DROP_KEYS = Object.keys(DROPS);

  // メンバー定義（通常攻撃値・スキル内容明記）
  const CHARACTER_POOL = [
    { id: "lawyer", name: "弁護士", icon: "⚖️", attack: 15, skill: "不開示解明", desc: "消去時に盤面の非開示枠（黒塗り）を全消去・無効化する。" },
    { id: "citizen", name: "市民", icon: "✊", attack: 10, skill: "市民連帯", desc: "編成内の市民の数に応じて全体スコア倍率が上昇（1人につき+15%）。" },
    { id: "reporter", name: "ジャーナリスト", icon: "🕵️", desc: "検証消去時のスコア還元率を+50%強化する。", attack: 12, skill: "事実追及" },
    { id: "expert", name: "研究者", icon: "👩‍💻", desc: "コンボ発生時のスコア加算倍率を底上げする。", attack: 8, skill: "データ分析" },
    { id: "activist", name: "活動家", icon: "📣", desc: "対話消去時に残り時間を+2秒延長する。", attack: 11, skill: "異議申立て" }
  ];

  // 敵の定義
  const ENEMIES = [
    { name: "強行採決委員会", desc: "非開示枠を追加" },
    { name: "汚職政党", desc: "不透明化の推進" },
    { name: "世論誘導広報室", desc: "連帯の妨害" }
  ];

  // --- ゲーム状態変数 ---
  let canvas, ctx;
  let board = [];
  let score = 0;
  let timeLeft = GAME_TIME;
  let timerInterval = null;
  
  // 重複選択用カウント状態 (各IDの選択数)
  let partyCounts = { lawyer: 0, citizen: 0, reporter: 0, expert: 0, activist: 0 };
  let activePartyList = [];

  let isDragging = false;
  let currentTile = { r: 0, c: 0 };
  let dragPos = { x: 0, y: 0 };
  let animating = false;
  let matchHighlights = [];
  let overlayTimer = null;

  window.onload = () => {
    canvas = document.getElementById("puzzleCanvas");
    ctx = canvas.getContext("2d");

    canvas.addEventListener("mousedown", startDrag);
    canvas.addEventListener("mousemove", drag);
    canvas.addEventListener("mouseup", endDrag);
    canvas.addEventListener("touchstart", (e) => startDrag(e.touches[0]));
    canvas.addEventListener("touchmove", (e) => drag(e.touches[0]));
    canvas.addEventListener("touchend", endDrag);

    // 初期パーティ設定（自動ランダム5名でスタート）
    randomizePartyCounts();
    buildActivePartyList();
    startTimerGame();
  };

  // --- 重複対応編成ロジック ---
  function randomizePartyCounts() {
    partyCounts = { lawyer: 0, citizen: 0, reporter: 0, expert: 0, activist: 0 };
    for (let i = 0; i < 5; i++) {
      const char = CHARACTER_POOL[Math.floor(Math.random() * CHARACTER_POOL.length)];
      partyCounts[char.id]++;
    }
  }

  function buildActivePartyList() {
    activePartyList = [];
    CHARACTER_POOL.forEach(char => {
      const count = partyCounts[char.id] || 0;
      for (let i = 0; i < count; i++) {
        activePartyList.push(char);
      }
    });
  }

  function renderSelectionPool() {
    const poolContainer = document.getElementById("selection-pool");
    poolContainer.innerHTML = "";

    CHARACTER_POOL.forEach(char => {
      const count = partyCounts[char.id] || 0;
      const row = document.createElement("div");
      row.className = "select-card-row";
      row.innerHTML = `
        <div style="font-size:1.6rem;">${char.icon}</div>
        <div class="select-card-info">
          <div class="name">${char.name}</div>
          <div class="stats">通常攻撃力: <strong>P:${char.attack}</strong> | ${char.skill}</div>
          <div class="desc">${char.desc}</div>
        </div>
        <div class="counter-btn-group">
          <button class="btn-counter" onclick="adjustCount('${char.id}', -1)">-</button>
          <span style="font-weight:bold; width:16px; text-align:center;">${count}</span>
          <button class="btn-counter" onclick="adjustCount('${char.id}', 1)">+</button>
        </div>
      `;
      poolContainer.appendChild(row);
    });

    const totalSelected = Object.values(partyCounts).reduce((a, b) => a + b, 0);
    document.getElementById("select-count").innerText = totalSelected;
    
    // プレビュー表示
    const preview = document.getElementById("selected-preview");
    preview.innerHTML = "";
    CHARACTER_POOL.forEach(char => {
      const count = partyCounts[char.id] || 0;
      for (let i = 0; i < count; i++) {
        const div = document.createElement("div");
        div.className = "party-member";
        div.innerHTML = `<div class="member-icon">${char.icon}</div><div>${char.name}</div>`;
        preview.appendChild(div);
      }
    });
  }

  function adjustCount(id, delta) {
    const total = Object.values(partyCounts).reduce((a, b) => a + b, 0);
    if (delta > 0 && total >= 5) return;
    if ((partyCounts[id] || 0) + delta < 0) return;

    partyCounts[id] = (partyCounts[id] || 0) + delta;
    renderSelectionPool();
  }

  function randomizeParty() {
    randomizePartyCounts();
    renderSelectionPool();
  }

  function openPartySelect() {
    renderSelectionPool();
    document.getElementById("party-select-modal").style.display = "flex";
  }

  function applyAndResumeGame() {
    const total = Object.values(partyCounts).reduce((a, b) => a + b, 0);
    if (total !== 5) {
      alert("メンバーをちょうど5名選んでください。");
      return;
    }
    buildActivePartyList();
    document.getElementById("party-select-modal").style.display = "none";
    updatePartyUI();
    updateSynergyUI();
  }

  // --- パーティ UI ＆ シナジー更新 ---
  function updatePartyUI() {
    const container = document.getElementById("party-container");
    container.innerHTML = "";
    activePartyList.forEach(m => {
      const div = document.createElement("div");
      div.className = "party-member";
      div.innerHTML = `<div class="member-icon">${m.icon}</div><div>${m.name}</div>`;
      container.appendChild(div);
    });
  }

  function updateSynergyUI() {
    const citizenCount = partyCounts['citizen'] || 0;
    const lawyerCount = partyCounts['lawyer'] || 0;
    const reporterCount = partyCounts['reporter'] || 0;
    const expertCount = partyCounts['expert'] || 0;
    const activistCount = partyCounts['activist'] || 0;

    let list = [];
    if (citizenCount > 0) list.push(`市民連帯: +${citizenCount * 15}%`);
    if (lawyerCount > 0) list.push(`弁護士(${lawyerCount}): 非開示消去`);
    if (reporterCount > 0) list.push(`記者: 検証+50%`);
    if (expertCount > 0) list.push(`研究者: コンボ強化`);
    if (activistCount > 0) list.push(`活動家: タイム+2s`);

    document.getElementById("synergy-display").innerText = "発動スキル: " + (list.length > 0 ? list.join(" / ") : "なし");
  }

  // --- ゲーム制御 ---
  function startTimerGame() {
    buildActivePartyList();
    updatePartyUI();
    updateSynergyUI();

    document.getElementById("party-select-modal").style.display = "none";
    document.getElementById("result-modal").style.display = "none";

    score = 0;
    timeLeft = GAME_TIME;
    updateStatusUI();

    createBoard();
    drawBoard();

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      
      // 15秒ごとに敵のスキル発動
      if (timeLeft > 0 && timeLeft % 15 === 0) {
        triggerEnemySkill();
      }

      updateStatusUI();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function triggerEnemySkill() {
    // 被弾演出
    const panel = document.getElementById("party-container");
    panel.classList.add("damage-flash");
    setTimeout(() => panel.classList.remove("damage-flash"), 300);

    // 敵の切り替え
    const randomEnemy = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
    document.getElementById("issue-name").innerText = randomEnemy.name;

    // ランダムで1箇所を非開示（黒塗り）枠にする
    let rx = Math.floor(Math.random() * COLS);
    let ry = Math.floor(Math.random() * ROWS);
    if (board[ry] && board[ry][rx]) {
      board[ry][rx].blackout = true;
      drawBoard();
      showOverlay("不透明な隠蔽！", `${randomEnemy.name}が非開示枠を追加`);
    }
  }

  function updateStatusUI() {
    document.getElementById("score-text").innerText = `${score} PTS`;
    document.getElementById("timer-text").innerText = `${timeLeft}s`;
  }

  function endGame() {
    clearInterval(timerInterval);
    document.getElementById("final-score").innerText = `${score} PTS`;
    document.getElementById("result-modal").style.display = "flex";
  }

  // --- コンボ・オーバーレイ表示（自動消滅機能） ---
  function showOverlay(mainText, subText) {
    const overlay = document.getElementById("combo-overlay");
    document.getElementById("combo-main").innerText = mainText;
    document.getElementById("combo-sub").innerText = subText;
    
    overlay.classList.add("show");

    if (overlayTimer) clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => {
      overlay.classList.remove("show");
    }, 1200);
  }

  // --- 盤面生成 ＆ 描画 ---
  function createBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      board[r] = [];
      for (let c = 0; c < COLS; c++) {
        const randomKey = DROP_KEYS[Math.floor(Math.random() * DROP_KEYS.length)];
        // 10%の確率で初期非開示枠
        const isLocked = Math.random() < 0.08;
        board[r][c] = { type: randomKey, blackout: isLocked, yOffset: 0, scale: 1 };
      }
    }
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (isDragging && currentTile.r === r && currentTile.c === c) continue;
        drawTile(r, c, board[r][c], c * TILE_SIZE, r * TILE_SIZE + (board[r][c].yOffset || 0));
      }
    }
    
    if (isDragging) {
      const tile = board[currentTile.r][currentTile.c];
      drawTile(currentTile.r, currentTile.c, tile, dragPos.x - TILE_SIZE/2, dragPos.y - TILE_SIZE/2, true);
    }
  }

  function drawTile(r, c, tile, x, y, isDragged = false) {
    ctx.save();
    ctx.translate(x + TILE_SIZE/2, y + TILE_SIZE/2);
    if (tile.scale) ctx.scale(tile.scale, tile.scale);
    ctx.translate(-TILE_SIZE/2, -TILE_SIZE/2);

    const dropData = DROPS[tile.type];
    ctx.fillStyle = isDragged ? "#ffffff" : dropData.bg;
    ctx.strokeStyle = dropData.border;
    ctx.lineWidth = isDragged ? 3 : 2;

    ctx.beginPath();
    ctx.roundRect(3, 3, TILE_SIZE - 6, TILE_SIZE - 6, 8);
    ctx.fill();
    ctx.stroke();

    if (matchHighlights.some(m => m.r === r && m.c === c)) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      ctx.fillRect(3, 3, TILE_SIZE - 6, TILE_SIZE - 6);
    }

    if (tile.blackout) {
      ctx.fillStyle = "#212529";
      ctx.fillRect(4, 4, TILE_SIZE - 8, TILE_SIZE - 8);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("非開示", TILE_SIZE / 2, TILE_SIZE / 2 + 4);
    } else {
      ctx.font = "30px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(dropData.symbol, TILE_SIZE / 2, TILE_SIZE / 2);
    }
    ctx.restore();
  }

  // --- パズル操作判定 ---
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDrag(e) {
    if (animating || timeLeft <= 0) return;
    const pos = getPos(e);
    const c = Math.floor(pos.x / TILE_SIZE);
    const r = Math.floor(pos.y / TILE_SIZE);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      // 非開示枠は直接動かせない
      if (board[r][c].blackout) {
        showOverlay("非開示枠です", "弁護士スキルで消去可能");
        return;
      }
      isDragging = true;
      currentTile = { r, c };
      dragPos = pos;
      drawBoard();
    }
  }

  function drag(e) {
    if (!isDragging || animating) return;
    dragPos = getPos(e);
    const c = Math.floor(dragPos.x / TILE_SIZE);
    const r = Math.floor(dragPos.y / TILE_SIZE);

    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      if ((r !== currentTile.r || c !== currentTile.c) && !board[r][c].blackout) {
        let temp = board[currentTile.r][currentTile.c];
        board[currentTile.r][currentTile.c] = board[r][c];
        board[r][c] = temp;
        currentTile = { r, c };
      }
    }
    drawBoard();
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    drawBoard();
    processMatches();
  }

  // --- コンボ・マッチ処理（弁護士の非開示枠クリア機能含む） ---
  async function processMatches() {
    animating = true;
    let comboCount = 0;

    while (true) {
      let matches = findMatches();
      if (matches.length === 0) break;

      comboCount++;
      matchHighlights = matches;

      let matchTypes = [...new Set(matches.map(m => board[m.r][m.c].type))];
      let actionName = DROPS[matchTypes[0]] ? DROPS[matchTypes[0]].name : "アクション";

      // 弁護士スキルチェック：パーティに弁護士がいれば盤面の非開示枠を全解除
      const lawyerCount = partyCounts['lawyer'] || 0;
      let clearBlackoutText = "";
      if (lawyerCount > 0) {
        let cleared = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c].blackout) {
              board[r][c].blackout = false;
              cleared++;
            }
          }
        }
        if (cleared > 0) clearBlackoutText = ` (非開示${cleared}件を解明!)`;
      }

      // オーバーレイの更新・表示（自動消滅付き）
      showOverlay(`${actionName} 成功！${clearBlackoutText}`, `${comboCount} Combo!`);

      // ハイライトアニメーション
      for (let i = 0; i < 2; i++) {
        matches.forEach(m => board[m.r][m.c].scale = (i % 2 === 0) ? 1.15 : 1.0);
        drawBoard();
        await sleep(50);
      }
      matchHighlights = [];

      // スコア計算
      // 全メンバーの基本攻撃値の合計
      let baseAttackSum = activePartyList.reduce((sum, m) => sum + m.attack, 0);
      
      const citizenCount = partyCounts['citizen'] || 0;
      const reporterCount = partyCounts['reporter'] || 0;
      const expertCount = partyCounts['expert'] || 0;
      const activistCount = partyCounts['activist'] || 0;

      // 基本点 ＋ 市民連帯（1人あたり+15%）
      let basePts = matches.length * (baseAttackSum / 2) * (1 + citizenCount * 0.15);
      
      // 記者の検証力（検証消去で+50%）
      if (matchTypes.includes("RED") && reporterCount > 0) {
        basePts *= (1 + 0.5 * reporterCount);
      }
      
      // 研究者のデータ分析（コンボ倍率底上げ）
      let comboMultiplier = 1 + (comboCount - 1) * (0.2 + expertCount * 0.15);
      basePts *= comboMultiplier;

      // 活動家の異議申立て（対話消去でタイム増加）
      if (matchTypes.includes("PINK") && activistCount > 0) {
        timeLeft = Math.min(GAME_TIME, timeLeft + 2 * activistCount);
      }

      score += Math.floor(basePts);
      updateStatusUI();

      applyGravity(matches);
      await animateDrop();
    }

    animating = false;
  }

  function findMatches() {
    let matched = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 2; c++) {
        let t1 = board[r][c], t2 = board[r][c+1], t3 = board[r][c+2];
        if (!t1.blackout && !t2.blackout && !t3.blackout && t1.type === t2.type && t2.type === t3.type) {
          matched.push({r, c}, {r, c: c+1}, {r, c: c+2});
        }
      }
    }
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS - 2; r++) {
        let t1 = board[r][c], t2 = board[r+1][c], t3 = board[r+2][c];
        if (!t1.blackout && !t2.blackout && !t3.blackout && t1.type === t2.type && t2.type === t3.type) {
          matched.push({r, c}, {r: r+1, c}, {r: r+2, c});
        }
      }
    }
    return matched.filter((v, i, a) => a.findIndex(t => t.r === v.r && t.c === v.c) === i);
  }

  function applyGravity(matches) {
    matches.forEach(m => board[m.r][m.c] = null);
    for (let c = 0; c < COLS; c++) {
      let emptySlots = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] === null) {
          emptySlots++;
        } else if (emptySlots > 0) {
          board[r + emptySlots][c] = board[r][c];
          board[r + emptySlots][c].yOffset = -emptySlots * TILE_SIZE;
          board[r][c] = null;
        }
      }
      for (let i = 0; i < emptySlots; i++) {
        const randomKey = DROP_KEYS[Math.floor(Math.random() * DROP_KEYS.length)];
        board[i][c] = { type: randomKey, blackout: false, yOffset: -emptySlots * TILE_SIZE, scale: 1 };
      }
    }
  }

  function animateDrop() {
    return new Promise(resolve => {
      let step = 0;
      const totalSteps = 5;
      const interval = setInterval(() => {
        step++;
        let hasOffset = false;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c] && board[r][c].yOffset < 0) {
              board[r][c].yOffset += TILE_SIZE / totalSteps;
              if (board[r][c].yOffset > 0) board[r][c].yOffset = 0;
              hasOffset = true;
            }
          }
        }
        drawBoard();
        if (step >= totalSteps || !hasOffset) {
          clearInterval(interval);
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (board[r][c]) board[r][c].yOffset = 0;
            }
          }
          drawBoard();
          resolve();
        }
      }, 20);
    });
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
