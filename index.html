<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Democracy Match</title>
  <!-- CSSの読み込み -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
  <div id="skill-banner"></div>

  <header class="header-bar">
    <span class="game-title">Democracy Match</span>
    <div class="header-btns">
      <button id="btn-party-open">パーティ選択</button>
      <button id="btn-reset">リセット</button>
    </div>
  </header>

  <section class="status-panel">
    <div class="info-row" style="margin-bottom:6px;">
      <span>残りターン: <strong id="rem-turns" style="color:var(--accent-blue); font-size:1rem;">20</strong></span>
      <span>score: <strong id="score-display">0</strong> pt</span>
    </div>

    <div class="bar-container">
      <div id="oppression-hp" class="bar-fill enemy-hp-fill"></div>
      <div id="oppression-hp-text" class="bar-text">抑圧度 3000 / 3000</div>
    </div>

    <div class="info-row" style="margin-bottom: 6px;">
      <span class="enemy-status-text" id="enemy-turn-info">--</span>
    </div>

    <div class="bar-container">
      <div id="player-hp" class="bar-fill player-hp-fill"></div>
      <div id="player-hp-text" class="bar-text">気力 100 / 100</div>
    </div>

    <div class="party-section">
      <div class="party-list" id="party-display"></div>
      <div class="buff-detail" id="buff-detail-text">効果: 計算中...</div>
    </div>
  </section>

  <main class="canvas-container">
    <canvas id="puzzleCanvas" width="360" height="300"></canvas>
  </main>

  <div id="result-modal" class="modal">
    <h2 id="modal-title">結果発表</h2>
    <div id="modal-body" style="font-size:0.85rem; line-height:1.5; margin: 10px 0; text-align:center;"></div>
    <div class="btn-group">
      <button class="btn" id="btn-result-restart">あきらめない</button>
      
      <div class="share-btn-row">
        <button class="btn-share-icon btn-share-x" id="btn-share-x" title="𝕏 でシェア">𝕏</button>
        <button class="btn-share-icon btn-share-other" id="btn-share-other" title="その他の方法でシェア">🔗</button>
      </div>
    </div>
  </div>

  <div id="party-modal" class="modal">
    <h2>パーティ選択</h2>
    <p style="font-size:0.7rem; color:#666; text-align:center; margin-bottom:8px;">枠を選択してからメンバーを指定（重複可能）</p>
    <div class="select-grid" id="modal-slots"></div>
    
    <button class="btn" id="btn-party-random" style="background: #495057; margin-bottom: 8px; padding: 6px; font-size: 0.75rem; max-width: 100%;">メンバーをランダム設定</button>
    <div class="job-list" id="modal-job-list"></div>

    <div style="font-size:0.75rem; font-weight:bold; margin-top:8px;">■ 行動ドロップ一覧</div>
    <table class="drop-info-table">
      <thead>
        <tr><th>種類</th><th>アイコン</th><th>効果</th></tr>
      </thead>
      <tbody>
        <tr><td>疑問</td><td>💬</td><td>10 pt</td></tr>
        <tr><td>報道</td><td>📢</td><td>10 pt</td></tr>
        <tr><td>検証</td><td>🔍</td><td>15 pt + 非開示解除 / 虚偽訂正</td></tr>
        <tr><td>署名</td><td>📜</td><td>職数×市民数×10 pt</td></tr>
        <tr><td>デモ</td><td>🪧</td><td>職数×市民数×10 pt</td></tr>
        <tr><td>対話</td><td>🤝</td><td>気力回復 + 買収奪還 + 虚偽訂正</td></tr>
      </tbody>
    </table>

    <button class="btn" id="btn-party-close" style="margin-top:12px; max-width: 100%;">決定して戻る</button>
  </div>
</div>

<!-- JSの読み込み（順番厳守: 設定データ ➔ メイン処理） -->
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
