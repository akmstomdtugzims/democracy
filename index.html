<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Democracy Time Attack</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --panel-bg: #ffffff;
      --text-main: #212529;
      --border-color: #dee2e6;
      --accent-red: #d90429;
      --accent-blue: #0077b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      position: relative;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .game-title { font-size: 1.1rem; font-weight: bold; color: #333; }
    .btn-sm {
      background: #e9ecef;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* スコア ＆ タイム */
    .status-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-display { font-size: 1.4rem; font-weight: bold; color: var(--accent-red); }
    .score-display { font-size: 1.2rem; font-weight: bold; color: var(--accent-blue); }

    /* 社会課題（敵エリア） */
    .issue-panel {
      background: #fff5f5;
      border: 1px solid #ffc9c9;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #c92a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* パーティエリア＆ダメージアクション */
    .party-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transition: background-color 0.1s ease;
    }
    .party-panel.damage-flash {
      background-color: #ffc9c9 !important;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    .party-member {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
    }
    .member-icon { font-size: 1.6rem; }

    /* パーティスキル表示枠 */
    .synergy-box {
      background: #e7f5ff;
      border: 1px solid #a5d8ff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      color: #1864ab;
      line-height: 1.3;
    }

    /* パズルキャンバス */
    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #ffffff;
      border: 2px solid #ced4da;
      border-radius: 8px;
      touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    /* モーダル */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      z-index: 100;
    }
    .modal-title { font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 10px; }
    .select-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .select-card {
      background: #f1f3f5;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .select-card.selected {
      border-color: var(--accent-blue);
      background: #e7f5ff;
    }
    .select-card .icon { font-size: 1.8rem; }

    .btn-main {
      background: #212529;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn-main:active { transform: scale(0.98); }

    .explanation-box {
      background: #f1f3f5;
      border-left: 4px solid var(--accent-blue);
      padding: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- ヘッダー -->
  <div class="header-bar">
    <span class="game-title">Democracy Time Attack</span>
    <button class="btn-sm" onclick="openPartySelect()">編成変更</button>
  </div>

  <!-- スコア＆タイマー -->
  <div class="status-panel">
    <div>
      <div style="font-size:0.7rem; color:#666;">民主主義スコア</div>
      <div class="score-display" id="score-text">0 PTS</div>
    </div>
    <div>
      <div style="font-size:0.7rem; color:#666; text-align:right;">残り時間</div>
      <div class="timer-display" id="timer-text">60s</div>
    </div>
  </div>

  <!-- パーティスキル表示 -->
  <div class="synergy-box" id="synergy-display">
    発動シナジー: なし
  </div>

  <!-- 直面する社会課題 -->
  <div class="issue-panel">
    <span>⚠️ 課題: <strong id="issue-name">強行採決の懸念</strong></span>
    <span style="font-size:0.7rem; color:#666;">(15秒ごとに干渉)</span>
  </div>

  <!-- パーティ表示 -->
  <div class="party-panel" id="party-container"></div>

  <!-- パズル盤面 -->
  <div class="canvas-container">
    <canvas id="puzzleCanvas" width="360" height="300"></canvas>
  </div>

  <!-- 【モーダル1】パーティ編成画面 -->
  <div id="party-select-modal" class="modal-overlay">
    <div>
      <div class="modal-title">社会参画メンバーの選択</div>
      <p style="font-size: 0.8rem; color:#666; text-align:center; margin-bottom: 12px;">
        5名のメンバーを選択してください（最大5名）
      </p>
      
      <div class="select-grid" id="selection-pool"></div>

      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <span style="font-size:0.8rem;">選択中: <strong id="select-count">0</strong> / 5</span>
        <button class="btn-sm" onclick="randomizeParty()">ランダム編成</button>
      </div>
      <div class="party-panel" id="selected-preview" style="min-height:50px;"></div>
    </div>

    <button class="btn-main" onclick="startTimerGame()">挑戦を開始する (60秒)</button>
  </div>

  <!-- 【モーダル2】リザルト画面 -->
  <div id="result-modal" class="modal-overlay" style="display:none;">
    <div>
      <div class="modal-title">タイムアップ！</div>
      <div style="text-align:center; margin: 20px 0;">
        <div style="font-size: 0.9rem; color:#666;">最終獲得民主主義スコア</div>
        <div style="font-size: 2.5rem; font-weight:bold; color:var(--accent-blue);" id="final-score">0 PTS</div>
      </div>

      <div class="explanation-box" id="result-eval-text">
        市民の継続的な関心と検証により、社会の透明性が一定程度維持されました。
      </div>
    </div>

    <div>
      <button class="btn-main" style="margin-bottom: 8px;" onclick="openPartySelect()">編成を変えて再挑戦</button>
      <button class="btn-main" style="background:#6c757d;" onclick="startTimerGame()">同じ編成で再挑戦</button>
    </div>
  </div>
</div>

<script>
  // --- 定数 ＆ 設定 ---
  const COLS = 6;
  const ROWS = 5;
  const TILE_SIZE = 60;
  const GAME_TIME = 60; // 制限時間 60秒

  const DROPS = {
    RED:    { bg: "#ffadad", border: "#ff6b6b", symbol: "🔍", name: "検証" },
    BLUE:   { bg: "#a0c4ff", border: "#4cc9f0", symbol: "📜", name: "署名" },
    GREEN:  { bg: "#caffbf", border: "#52b788", symbol: "🪧", name: "デモ" },
    YELLOW: { bg: "#fdffb6", border: "#ffd166", symbol: "📢", name: "拡散" },
    PINK:   { bg: "#ffc6ff", border: "#f72585", symbol: "💬", name: "対話" }
  };
  const DROP_KEYS = Object.keys(DROPS);

  const CHARACTER_POOL = [
    { id: "c1", name: "市民", icon: "🧑‍💼", desc: "市民連帯(+15%)", type: "citizen" },
    { id: "c2", name: "市民", icon: "👩‍🍳", desc: "市民連帯(+15%)", type: "citizen" },
    { id: "c3", name: "市民", icon: "🧑‍🌾", desc: "市民連帯(+15%)", type: "citizen" },
    { id: "s1", name: "弁護士", icon: "👩‍⚖️", desc: "非開示無効化", type: "lawyer" },
    { id: "s2", name: "記者", icon: "🕵️", desc: "検証力(+50%)", type: "reporter" },
    { id: "s3", name: "専門家", icon: "👩‍💻", desc: "調査力(+30%)", type: "expert" },
    { id: "s4", name: "政治家", icon: "🧑‍💼", desc: "対話で時間+2s", type: "politician" }
  ];

  const ISSUES = ["強行採決の懸念", "裏金問題の流出", "スピン報道の激化", "情報開示請求の拒否"];

  // --- ゲーム状態変数 ---
  let canvas, ctx;
  let board = [];
  let score = 0;
  let timeLeft = GAME_TIME;
  let timerInterval = null;
  let selectedPartyIds = [];
  let activeParty = [];

  let isDragging = false;
  let currentTile = { r: 0, c: 0 };
  let dragPos = { x: 0, y: 0 };
  let animating = false;
  let matchHighlights = [];
  
  // ポップアップテキストアニメーション用配列
  let floatingTexts = [];

  window.onload = () => {
    canvas = document.getElementById("puzzleCanvas");
    ctx = canvas.getContext("2d");

    canvas.addEventListener("mousedown", startDrag);
    canvas.addEventListener("mousemove", drag);
    canvas.addEventListener("mouseup", endDrag);
    canvas.addEventListener("touchstart", (e) => startDrag(e.touches[0]));
    canvas.addEventListener("touchmove", (e) => drag(e.touches[0]));
    canvas.addEventListener("touchend", endDrag);

    renderSelectionPool();
    randomizeParty();
  };

  // --- 編成画面の処理 ---
  function renderSelectionPool() {
    const poolContainer = document.getElementById("selection-pool");
    poolContainer.innerHTML = "";
    CHARACTER_POOL.forEach(char => {
      const card = document.createElement("div");
      card.className = `select-card ${selectedPartyIds.includes(char.id) ? 'selected' : ''}`;
      card.onclick = () => toggleSelectCharacter(char.id);
      card.innerHTML = `<div class="icon">${char.icon}</div><strong>${char.name}</strong><br><span style="color:#666; font-size:0.65rem;">${char.desc}</span>`;
      poolContainer.appendChild(card);
    });
  }

  function toggleSelectCharacter(id) {
    if (selectedPartyIds.includes(id)) {
      selectedPartyIds = selectedPartyIds.filter(item => item !== id);
    } else {
      if (selectedPartyIds.length < 5) selectedPartyIds.push(id);
    }
    updateSelectionUI();
  }

  function randomizeParty() {
    let shuffled = [...CHARACTER_POOL].sort(() => 0.5 - Math.random());
    selectedPartyIds = shuffled.slice(0, 5).map(c => c.id);
    updateSelectionUI();
  }

  function updateSelectionUI() {
    renderSelectionPool();
    document.getElementById("select-count").innerText = selectedPartyIds.length;
    const preview = document.getElementById("selected-preview");
    preview.innerHTML = "";
    selectedPartyIds.forEach(id => {
      const char = CHARACTER_POOL.find(c => c.id === id);
      const div = document.createElement("div");
      div.className = "party-member";
      div.innerHTML = `<div class="member-icon">${char.icon}</div><div>${char.name}</div>`;
      preview.appendChild(div);
    });
  }

  function openPartySelect() {
    clearInterval(timerInterval);
    document.getElementById("result-modal").style.display = "none";
    document.getElementById("party-select-modal").style.display = "flex";
  }

  // --- スキル表示の更新 ---
  function updateSynergyUI() {
    const citizenCount = activeParty.filter(p => p.type === "citizen").length;
    const hasLawyer = activeParty.some(p => p.type === "lawyer");
    const hasReporter = activeParty.some(p => p.type === "reporter");
    const hasExpert = activeParty.some(p => p.type === "expert");
    const hasPolitician = activeParty.some(p => p.type === "politician");

    let list = [];
    if (citizenCount > 0) list.push(`市民連帯: +${citizenCount * 15}%`);
    if (hasLawyer) list.push(`弁護士: 非開示ガード`);
    if (hasReporter) list.push(`記者: 検証力+50%`);
    if (hasExpert) list.push(`専門家: 調査力+30%`);
    if (hasPolitician) list.push(`政治家: 対話で時間+2s`);

    document.getElementById("synergy-display").innerText = "発動スキル: " + (list.length > 0 ? list.join(" / ") : "なし");
  }

  // --- ゲーム制御 ---
  function startTimerGame() {
    if (selectedPartyIds.length === 0) randomizeParty();

    activeParty = selectedPartyIds.map(id => CHARACTER_POOL.find(c => c.id === id));
    
    // パーティ表示の更新
    const container = document.getElementById("party-container");
    container.innerHTML = "";
    activeParty.forEach(m => {
      const div = document.createElement("div");
      div.className = "party-member";
      div.innerHTML = `<div class="member-icon">${m.icon}</div><div>${m.name}</div>`;
      container.appendChild(div);
    });

    updateSynergyUI();

    document.getElementById("party-select-modal").style.display = "none";
    document.getElementById("result-modal").style.display = "none";

    score = 0;
    timeLeft = GAME_TIME;
    floatingTexts = [];
    updateStatusUI();

    createBoard();
    drawBoard();

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      
      // 15秒ごとに敵のスキル発動（課題更新＋被弾アクション）
      if (timeLeft > 0 && timeLeft % 15 === 0) {
        triggerEnemySkill();
      }

      updateStatusUI();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function triggerEnemySkill() {
    // パーティゾーンにダメージアクション（点滅＆揺れ）
    const panel = document.getElementById("party-container");
    panel.classList.add("damage-flash");
    setTimeout(() => panel.classList.remove("damage-flash"), 300);

    // 課題の変更
    const randomIssue = ISSUES[Math.floor(Math.random() * ISSUES.length)];
    document.getElementById("issue-name").innerText = randomIssue;

    // 弁護士がいない場合はランダムで1箇所を非開示（マス障害）にする
    const hasLawyer = activeParty.some(p => p.type === "lawyer");
    if (!hasLawyer) {
      let rx = Math.floor(Math.random() * COLS);
      let ry = Math.floor(Math.random() * ROWS);
      if (board[ry] && board[ry][rx]) {
        board[ry][rx].blackout = true;
        drawBoard();
      }
    }
  }

  function updateStatusUI() {
    document.getElementById("score-text").innerText = `${score} PTS`;
    document.getElementById("timer-text").innerText = `${timeLeft}s`;
  }

  function endGame() {
    clearInterval(timerInterval);
    document.getElementById("final-score").innerText = `${score} PTS`;
    document.getElementById("result-modal").style.display = "flex";
  }

  // --- 盤面生成 ＆ 描画 ---
  function createBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      board[r] = [];
      for (let c = 0; c < COLS; c++) {
        const randomKey = DROP_KEYS[Math.floor(Math.random() * DROP_KEYS.length)];
        board[r][c] = { type: randomKey, blackout: false, yOffset: 0, scale: 1 };
      }
    }
  }

  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 1. パズルマスの描画
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (isDragging && currentTile.r === r && currentTile.c === c) continue;
        drawTile(r, c, board[r][c], c * TILE_SIZE, r * TILE_SIZE + (board[r][c].yOffset || 0));
      }
    }
    
    // 2. ドラッグ中マスの描画
    if (isDragging) {
      const tile = board[currentTile.r][currentTile.c];
      drawTile(currentTile.r, currentTile.c, tile, dragPos.x - TILE_SIZE/2, dragPos.y - TILE_SIZE/2, true);
    }

    // 3. 浮遊コンボテキスト（パズル上のオーバーレイ表示）の描画
    drawFloatingTexts();
  }

  function drawTile(r, c, tile, x, y, isDragged = false) {
    ctx.save();
    ctx.translate(x + TILE_SIZE/2, y + TILE_SIZE/2);
    if (tile.scale) ctx.scale(tile.scale, tile.scale);
    ctx.translate(-TILE_SIZE/2, -TILE_SIZE/2);

    const dropData = DROPS[tile.type];
    ctx.fillStyle = isDragged ? "#ffffff" : dropData.bg;
    ctx.strokeStyle = dropData.border;
    ctx.lineWidth = isDragged ? 3 : 2;

    ctx.beginPath();
    ctx.roundRect(3, 3, TILE_SIZE - 6, TILE_SIZE - 6, 8);
    ctx.fill();
    ctx.stroke();

    if (matchHighlights.some(m => m.r === r && m.c === c)) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      ctx.fillRect(3, 3, TILE_SIZE - 6, TILE_SIZE - 6);
    }

    if (tile.blackout) {
      ctx.fillStyle = "#333";
      ctx.fillRect(4, 4, TILE_SIZE - 8, TILE_SIZE - 8);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("非開示", TILE_SIZE / 2, TILE_SIZE / 2 + 4);
    } else {
      ctx.font = "30px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(dropData.symbol, TILE_SIZE / 2, TILE_SIZE / 2);
    }
    ctx.restore();
  }

  // --- パズル上で浮き上がるコンボ演出テキスト ---
  function addFloatingText(text, x, y) {
    floatingTexts.push({ text, x, y, alpha: 1.0, life: 30 });
  }

  function drawFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      let ft = floatingTexts[i];
      ctx.save();
      ctx.globalAlpha = ft.alpha;
      ctx.font = "bold 18px sans-serif";
      ctx.fillStyle = "#d90429";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.textAlign = "center";
      
      // 文字の縁取りと本体の描画
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();

      ft.y -= 1.2; // 上へ浮き上がる
      ft.alpha -= 0.03; // フェードアウト
      ft.life--;

      if (ft.life <= 0) {
        floatingTexts.splice(i, 1);
      }
    }
  }

  // --- 操作判定 ---
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDrag(e) {
    if (animating || timeLeft <= 0) return;
    const pos = getPos(e);
    const c = Math.floor(pos.x / TILE_SIZE);
    const r = Math.floor(pos.y / TILE_SIZE);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      isDragging = true;
      currentTile = { r, c };
      dragPos = pos;
      drawBoard();
    }
  }

  function drag(e) {
    if (!isDragging || animating) return;
    dragPos = getPos(e);
    const c = Math.floor(dragPos.x / TILE_SIZE);
    const r = Math.floor(dragPos.y / TILE_SIZE);

    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      if (r !== currentTile.r || c !== currentTile.c) {
        let temp = board[currentTile.r][currentTile.c];
        board[currentTile.r][currentTile.c] = board[r][c];
        board[r][c] = temp;
        currentTile = { r, c };
      }
    }
    drawBoard();
  }

  function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    drawBoard();
    processMatches();
  }

  // --- コンボ・マッチ処理 ---
  async function processMatches() {
    animating = true;
    let comboCount = 0;

    while (true) {
      let matches = findMatches();
      if (matches.length === 0) break;

      comboCount++;
      matchHighlights = matches;

      let matchTypes = [...new Set(matches.map(m => board[m.r][m.c].type))];

      // 消去地点（平均座標）に浮き上がるコンボテキストを追加
      let avgX = (matches.reduce((sum, m) => sum + m.c, 0) / matches.length) * TILE_SIZE + TILE_SIZE / 2;
      let avgY = (matches.reduce((sum, m) => sum + m.r, 0) / matches.length) * TILE_SIZE + TILE_SIZE / 2;
      let actionName = DROPS[matchTypes[0]] ? DROPS[matchTypes[0]].name : "連鎖";
      addFloatingText(`${actionName} ${comboCount}COMBO!`, avgX, avgY);

      // ハイライトアニメーション
      for (let i = 0; i < 2; i++) {
        matches.forEach(m => board[m.r][m.c].scale = (i % 2 === 0) ? 1.15 : 1.0);
        drawBoard();
        await sleep(50);
      }
      matchHighlights = [];

      // スコア計算・シナジー適用
      let citizenCount = activeParty.filter(p => p.type === "citizen").length;
      let hasReporter = activeParty.some(p => p.type === "reporter");
      let hasExpert = activeParty.some(p => p.type === "expert");
      let hasPolitician = activeParty.some(p => p.type === "politician");

      // 基本点＋市民連帯（1人あたり+15%）
      let basePts = matches.length * 20 * (1 + citizenCount * 0.15);
      
      // 記者の検証力（検証消去で+50%）
      if (matchTypes.includes("RED") && hasReporter) basePts *= 1.5;
      
      // 専門家の調査力（コンボ倍率+30%）
      let comboMultiplier = 1 + (comboCount - 1) * (hasExpert ? 0.3 : 0.1);
      basePts *= comboMultiplier;

      // 政治家の対話時タイム増加
      if (matchTypes.includes("PINK") && hasPolitician) {
        timeLeft = Math.min(GAME_TIME, timeLeft + 2);
      }

      score += Math.floor(basePts);
      
      // マス障害（非開示）の解除
      matches.forEach(m => board[m.r][m.c].blackout = false);
      updateStatusUI();

      applyGravity(matches);
      await animateDrop();
    }

    animating = false;
  }

  function findMatches() {
    let matched = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 2; c++) {
        let t1 = board[r][c].type, t2 = board[r][c+1].type, t3 = board[r][c+2].type;
        if (t1 === t2 && t2 === t3) matched.push({r, c}, {r, c: c+1}, {r, c: c+2});
      }
    }
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS - 2; r++) {
        let t1 = board[r][c].type, t2 = board[r+1][c].type, t3 = board[r+2][c].type;
        if (t1 === t2 && t2 === t3) matched.push({r, c}, {r: r+1, c}, {r: r+2, c});
      }
    }
    return matched.filter((v, i, a) => a.findIndex(t => t.r === v.r && t.c === v.c) === i);
  }

  function applyGravity(matches) {
    matches.forEach(m => board[m.r][m.c] = null);
    for (let c = 0; c < COLS; c++) {
      let emptySlots = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] === null) {
          emptySlots++;
        } else if (emptySlots > 0) {
          board[r + emptySlots][c] = board[r][c];
          board[r + emptySlots][c].yOffset = -emptySlots * TILE_SIZE;
          board[r][c] = null;
        }
      }
      for (let i = 0; i < emptySlots; i++) {
        const randomKey = DROP_KEYS[Math.floor(Math.random() * DROP_KEYS.length)];
        board[i][c] = { type: randomKey, blackout: false, yOffset: -emptySlots * TILE_SIZE, scale: 1 };
      }
    }
  }

  function animateDrop() {
    return new Promise(resolve => {
      let step = 0;
      const totalSteps = 5;
      const interval = setInterval(() => {
        step++;
        let hasOffset = false;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (board[r][c] && board[r][c].yOffset < 0) {
              board[r][c].yOffset += TILE_SIZE / totalSteps;
              if (board[r][c].yOffset > 0) board[r][c].yOffset = 0;
              hasOffset = true;
            }
          }
        }
        drawBoard();
        if (step >= totalSteps || !hasOffset) {
          clearInterval(interval);
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              if (board[r][c]) board[r][c].yOffset = 0;
            }
          }
          drawBoard();
          resolve();
        }
      }, 20);
    });
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
